[package]
name = "agnt"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agnt"
path = "src/main.rs"

[dependencies]
agnt-common = { path = "../agnt-common" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde_json = "1"
pulldown-cmark = "0.13"
